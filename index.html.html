<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma SIAR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Cuando confirmes que todo anda, fijá la versión: @n8n/chat@X.Y.Z -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css">

  <style>
    :root {
      --primary: #a51984;
      --primary-deep: #7d0f63;
      --primary-light: #c62ba1;
      --primary-soft: #fbeff7;
      --ink: #1a1226;
      --text: #3b3347;
      --muted: #7b7389;
      --line: #ece6f0;
      --ground: #f6f3f8;

      --shadow-panel: 0 1px 2px rgba(40,20,60,.04), 0 12px 32px -8px rgba(60,20,80,.14);
      --shadow-lift: 0 2px 4px rgba(40,20,60,.05), 0 10px 22px -6px rgba(60,20,80,.18);
      --shadow-brand: 0 10px 22px -6px rgba(165,25,132,.5);

      /* Variables oficiales del widget de n8n */
      --chat--color-primary: #a51984;
      --chat--color-primary-shade-50: #8e1470;
      --chat--color-primary-shade-100: #7d0f63;
      --chat--color-secondary: #a51984;
      --chat--font-family: 'Plus Jakarta Sans', sans-serif;
      --chat--spacing: 1rem;
      --chat--border-radius: 18px;
      --chat--body--background: transparent;
      --chat--footer--background: transparent;
    }

    html, body {
      width: 100%; height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 4% -8%, #f3d4ea 0%, transparent 62%),
        radial-gradient(800px 480px at 100% 108%, #e2e6f8 0%, transparent 60%),
        var(--ground);
    }
    .app, .app * { box-sizing: border-box; }
    button { font-family: inherit; }

    /* Layout: paneles flotantes que ocupan exactamente el alto disponible */
    .app {
      display: flex;
      gap: 14px;
      padding: 14px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---------- Panel lateral ---------- */
    .sidebar {
      width: 276px;
      min-width: 276px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 26px;
      box-shadow: var(--shadow-panel);
      transition: margin-left .28s cubic-bezier(.4,0,.2,1), opacity .2s ease;
      z-index: 20;
    }
    .sidebar.collapsed { margin-left: -290px; opacity: 0; pointer-events: none; }

    .brand {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 20px 14px;
    }
    .brand-badge {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--primary-light), var(--primary-deep));
      color: #fff;
      font-size: 1rem;
      box-shadow: var(--shadow-brand);
    }
    .brand-name { display: block; font-weight: 800; font-size: 1rem; color: var(--ink); letter-spacing: -.01em; }
    .brand-sub { display: block; font-size: .75rem; color: var(--muted); margin-top: 1px; }

    .btn-new {
      margin: 6px 16px 8px;
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary-light), var(--primary-deep));
      color: #fff;
      font-weight: 700; font-size: .86rem;
      cursor: pointer;
      box-shadow: var(--shadow-brand);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn-new:hover { transform: translateY(-2px); filter: brightness(1.06); box-shadow: 0 14px 26px -8px rgba(165,25,132,.6); }
    .btn-new:active { transform: translateY(0) scale(.98); }

    .history-title {
      padding: 16px 22px 8px;
      font-size: .82rem;
      font-weight: 700;
      color: var(--ink);
    }
    .history {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 0 12px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .history a {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      color: var(--text);
      font-size: .84rem; font-weight: 500;
      text-decoration: none;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .history a:hover { background: #fff; border-color: var(--line); box-shadow: var(--shadow-lift); color: var(--primary-deep); }
    .history .ico {
      width: 32px; height: 32px; flex: none;
      display: grid; place-items: center;
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: .85rem;
    }
    .history .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .history .txt b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history .txt small { color: var(--muted); font-size: .72rem; margin-top: 1px; }
    .history-empty {
      margin: 6px 4px; padding: 22px 14px;
      text-align: center;
      font-size: .8rem; line-height: 1.5; color: var(--muted);
      border: 1.5px dashed #e3d6ea;
      border-radius: 18px;
    }
    .history-empty svg { display: block; width: 28px; height: 28px; margin: 0 auto 8px; color: #d3b6cb; }

    /* ---------- Panel principal ---------- */
    .main {
      flex: 1; min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 26px;
      box-shadow: var(--shadow-panel);
      overflow: hidden;
    }
    .topbar {
      height: 62px; min-height: 62px;
      padding: 0 20px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .toggle {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(40,20,60,.05);
      transition: color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .toggle:hover { color: var(--primary); box-shadow: var(--shadow-lift); transform: translateY(-1px); }
    .topbar-title { font-weight: 700; font-size: .95rem; color: var(--ink); }
    .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 10px;
      border-radius: 999px;
      background: #effaf3;
      color: #1d7a45;
      font-size: .76rem; font-weight: 600;
    }
    .status::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: #2fb866;
      box-shadow: 0 0 0 0 rgba(47,184,102,.55);
      animation: pulse 2.2s infinite;
    }

    /* ---------- Chat ---------- */
    #chat { flex: 1; min-height: 0; width: 100%; position: relative; overflow: hidden; }
    #chat .chat-layout, #chat .chat-window-wrapper { height: 100%; width: 100%; background: transparent; }
    #chat .chat-header { display: none; }
    #chat .chat-body { padding: 18px 8px 8px; }

    #chat .chat-message {
      max-width: 82%;
      padding: 13px 17px;
      border-radius: 20px;
      font-size: .93rem; line-height: 1.6;
      animation: pop .32s cubic-bezier(.2,.9,.3,1.2) both;
    }
    #chat .chat-message-from-bot {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
      box-shadow: 0 1px 2px rgba(40,20,60,.04), 0 8px 18px -8px rgba(60,20,80,.12);
    }
    #chat .chat-message-from-user {
      background: linear-gradient(135deg, var(--primary-light), var(--primary-deep));
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 22px -8px rgba(165,25,132,.55);
    }
    #chat .chat-message a { color: var(--primary); font-weight: 600; text-underline-offset: 3px; }
    #chat .chat-message-from-user a { color: #fff; }

    #chat .chat-footer { border: 0; background: transparent; padding: 6px 22px 20px; }
    #chat .chat-inputs {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 8px 8px 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 1px 2px rgba(40,20,60,.04), 0 14px 30px -12px rgba(60,20,80,.2);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    #chat .chat-inputs:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(165,25,132,.12), 0 14px 30px -12px rgba(165,25,132,.3);
    }
    #chat .chat-inputs textarea {
      border: 0; outline: 0; background: transparent; box-shadow: none;
      font-family: inherit; font-size: .93rem; color: var(--ink);
    }
    #chat .chat-input-send-button, #chat .chat-input-file-button {
      border-radius: 14px;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    #chat .chat-input-send-button {
      background: linear-gradient(135deg, var(--primary-light), var(--primary-deep));
      color: #fff;
      box-shadow: 0 8px 16px -6px rgba(165,25,132,.55);
    }
    #chat .chat-input-send-button:hover:not(:disabled) { transform: translateY(-1px) scale(1.04); }
    #chat .chat-input-file-button:hover { background: var(--primary-soft); color: var(--primary); }

    * { scrollbar-width: thin; scrollbar-color: #d9cce2 transparent; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* Entrada de la pantalla: una sola secuencia al cargar */
    .sidebar { animation: slide-in .6s cubic-bezier(.2,.8,.2,1) both; }
    .main { animation: rise .6s .08s cubic-bezier(.2,.8,.2,1) both; }

    @keyframes slide-in { from { opacity: 0; transform: translateX(-18px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } }
    @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(47,184,102,0); } 100% { box-shadow: 0 0 0 0 rgba(47,184,102,0); } }

    /* Celular: el panel lateral se superpone y arranca cerrado */
    @media (max-width: 768px) {
      .app { padding: 8px; gap: 0; }
      .sidebar { position: absolute; top: 8px; bottom: 8px; left: 8px; box-shadow: 0 24px 48px -12px rgba(40,10,60,.35); background: rgba(255,255,255,.96); }
      .sidebar.collapsed { margin-left: -300px; }
      .status { display: none; }
      #chat .chat-message { max-width: 92%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Logo Bagó */
    .brand-badge { background: none; overflow: hidden; width: 46px; height: 46px; border-radius: 15px; }
    .brand-badge img, .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar { width: 38px; height: 38px; border-radius: 13px; overflow: hidden; box-shadow: 0 8px 16px -8px rgba(165,25,132,.6); flex: none; }
    .toggle svg { width: 18px; height: 18px; }
    .btn-new svg { width: 16px; height: 16px; }
    .history .ico svg { width: 16px; height: 16px; }
  </style>
</head>

        <div>
          <span class="brand-name">SIAR Docs</span>
          <span class="brand-sub">Especificaciones</span>
        </div>
      </div>

      <button class="btn-new" onclick="nuevoChat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Nueva especificación
      </button>

      <div class="history-title">Documentos generados</div>
      <nav class="history" id="history" aria-label="Documentos generados"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="toggle" onclick="toggleSidebar()" aria-label="Mostrar u ocultar el panel lateral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
        </button>
        <span class="avatar"><img id="logo2" alt=""></span><span class="topbar-title">Asistente SIAR</span>
        <span class="status">En línea</span>
      </header>
      <div id="chat"></div>
    </main>
  </div>

  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    const WEBHOOK_URL = 'https://magagrabow.app.n8n.cloud/webhook/235938ee-73bb-4740-b6b5-bee40df18a26/chat';
    const STORAGE_KEY = 'siar_docs';
    const DOC_LINK = 'a[href*="docs.google.com/document"]';

    /* ---------- Almacenamiento seguro (puede estar bloqueado en iframes) ---------- */
    const store = {
      get() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } },
      set(v) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch {} },
      clearChat() {
        try {
          Object.keys(localStorage)
            .filter(k => k.startsWith('n8n-chat'))
            .forEach(k => localStorage.removeItem(k));
        } catch {}
      }
    };

    /* ---------- Chat ---------- */
    let observer;

    function initChat() {
      const target = document.getElementById('chat');
      target.innerHTML = '';
      if (observer) observer.disconnect();

      createChat({
        webhookUrl: WEBHOOK_URL,
        target: '#chat',
        mode: 'fullscreen',
        showWelcomeScreen: false,
        defaultLanguage: 'es',
        allowFileUploads: true,
        allowedFilesMimeTypes: 'image/*',
        initialMessages: [
          '¡Hola! Soy **SIAR**, tu asistente para armar especificaciones de requerimientos.',
          '¿Qué módulo o proceso vamos a definir hoy?'
        ],
        i18n: { es: { inputPlaceholder: 'Escribí tu mensaje...' } }
      });

      watchForDocs(target);
    }

    /* Detecta links a Google Docs en las respuestas del agente y los guarda */
    function watchForDocs(target) {
      const scan = () => {
        const docs = store.get();
        let changed = false;
        target.querySelectorAll(DOC_LINK).forEach(a => {
          const url = a.href;
          if (docs.some(d => d.url === url)) return;
          docs.unshift({ url, fecha: new Date().toISOString() });
          changed = true;
        });
        if (changed) { store.set(docs.slice(0, 50)); renderHistory(); }
      };
      observer = new MutationObserver(scan);
      observer.observe(target, { childList: true, subtree: true });
    }

    /* ---------- Historial ---------- */
    function renderHistory() {
      const box = document.getElementById('history');
      const docs = store.get();
      box.replaceChildren();

      if (!docs.length) {
        const empty = document.createElement('div');
        empty.className = 'history-empty';
        empty.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
        empty.append('Acá van a aparecer los documentos que generes.');
        box.appendChild(empty);
        return;
      }

      docs.forEach(d => {
        const a = document.createElement('a');
        a.href = d.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        const ico = document.createElement('span');
        ico.className = 'ico';
        ico.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>';

        const txt = document.createElement('span');
        txt.className = 'txt';
        const title = document.createElement('b');
        title.textContent = 'Documento de alcance';
        const small = document.createElement('small');
        small.textContent = new Date(d.fecha).toLocaleDateString('es-AR', { day: '2-digit', month: 'long' });
        txt.append(title, small);

        a.append(ico, txt);
        box.appendChild(a);
      });
    }

    /* ---------- Acciones de la interfaz ---------- */
    window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');

    window.nuevoChat = () => {
      store.clearChat();            // nueva sesión: el agente no arrastra la charla anterior
      initChat();
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('collapsed');
    };

    /* ---------- Logo ---------- */
    const logoSrc = document.getElementById('logo').src;
    document.getElementById('logo2').src = logoSrc;
    const fav = document.createElement('link');
    fav.rel = 'icon'; fav.href = logoSrc;
    document.head.appendChild(fav);

    /* ---------- Inicio ---------- */
    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('collapsed');
    renderHistory();
    initChat();
  </script>
</body>
</html>
